<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Page</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav id="navbar">
            <ul id="nav-list">
                <img src="../../public/assets/menu_icon.png" alt="menu icon">
                <li>Rescue center</li>
                <li>Apply to adopt</li>
                <li>Volunteer</li>
                <li>Ways to give</li>
                <li>Events</li>
                <li class="phone">
                    <img src="../../public/assets/phone.svg" alt="phone icon">
                    631-249-7325
                </li>
                <button class="button-donate">
                    <img src="../../public/assets/heart.svg" alt="heart icon">
                    Donate
                </button>
            </ul>
            <div id="line"></div>
        </nav>
    </header>

    <div class="main-screen">
        <div class="main-content">
            <button class="button-success">
                <img src="../../public/assets/back_icon.svg" alt="back icon">
                Back
            </button>
            <h1>Success!</h1>
            <p>
                Thank you for contributing to the animal cause. Share our page and be part of this circle of love and affection.
            </p>
        </div>
    </div>

    <dialog class="second-modal">
        <div class="donate-header">
            <h1 class="title-modal">
                Choose your Donate
            </h1>
        </div>
        <form id="donate-form" class="donate-body" action="" method="post">                
            <div class="wrap-donate">
                <label class="wrap-label">EMAIL<span>*</span></label>
                <div class="form-donate">
                    <input 
                        type="email" 
                        name="email"
                        placeholder="youremail@here"
                        class="input" 
                        required
                    >
                </div>
            </div>                        
            <div class="wrap-donate">
                <label class="wrap-label">HOW MUCH CAN YOU HELP?<span>*</span></label>
                <div class="form-donate">
                    <input 
                        type="number"
                        name="value"
                        id="value"
                        min="1.00"
                        step="0.05"
                        placeholder="R$ 95,00"
                        class="input input-donate"
                        required
                    >
                </div>
            </div>

            <div class="wrap wrap-pay">
                <label class="wrap-label">PAYMENT METHOD<span>*</span></label>
                <div class="container-pay">                        
                    <div class="box-pay">
                        <input 
                            type="radio" 
                            name="payment" 
                            class="input-pay" 
                            id="pix"
                            required
                        >
                        <label for="pix" class="label-pay">Pix</label>
                    </div>
                    <div class="box-credit">
                        <input 
                            type="radio" 
                            name="payment" 
                            class="input-pay" 
                            id="credit" 
                        >
                        <label for="credit" class="label-pay">Credit Card</label>
                    </div>
                    <div class="box-pay">
                        <input 
                            type="radio" 
                            name="payment" 
                            class="input-pay" 
                            id="paypal"
                        >
                        <label for="paypal" class="label-pay">Paypal</label>
                    </div>
                </div>
            </div>

            <button type="button" class="btn-donate button-help" id="help-btn">
                <img src="../../public/assets/heart.svg" alt="heart icon">
                I wanna Help!
            </button>
            <button type="button" class="btn-donate button-cancel" id="close-donate">
                <img src="../../public/assets/back_icon.svg" alt="back icon">
                Cancel
            </button>
        </form>
    </dialog>

    <script src="main.js"></script>
</body>
</html>
