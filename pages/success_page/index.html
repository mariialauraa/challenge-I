<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Page</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav id="navbar">
            <ul id="nav-list">
                <img src="../../public/assets/menu_icon.png" alt="menu icon">
                <li>Rescue center</li>
                <li>Apply to adopt</li>
                <li>Volunteer</li>
                <li>Ways to give</li>
                <li>Events</li>
                <li class="phone">
                    <img src="../../public/assets/phone.svg" alt="phone icon">
                    631-249-7325
                </li>
                <button class="button-donate">
                    <img src="../../public/assets/heart.svg" alt="heart icon">
                    Donate
                </button>
            </ul>
            <div id="line"></div>
        </nav>
    </header>

    <div class="main-screen">
        <div class="main-content">
            <button class="button-success">
                <img src="../../public/assets/back_icon.svg" alt="back icon">
                Back
            </button>
            <h1>Success!</h1>
            <p>
                Free your creativity and create a beautiful success page to thank your user for subscribing/donating to our project.
            </p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
